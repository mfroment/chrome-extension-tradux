<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 10px; width: 300px; }
    label { font-weight: bold; font-size: 13px; display: block; margin-top: 10px; margin-bottom: 3px; }
    input, select, textarea {
      width: 100%; padding: 5px; box-sizing: border-box;
      font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
    }
    textarea { resize: vertical; min-height: 60px; font-family: monospace; }
    small { color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <label>Provider</label>
  <select id="provider">
    <option value="openai">OpenAI (GPT)</option>
    <option value="anthropic">Anthropic (Claude)</option>
    <option value="google">Google (Gemini)</option>
  </select>

  <label>API Key</label>
  <input id="apikey" type="password" placeholder="API key for selected provider" />

  <label>Model <small>(leave blank for provider default)</small></label>
  <input id="model" type="text" placeholder="e.g. claude-sonnet-4-6, gpt-5.2, gemini-3-flash-preview-1.5-pro" />

  <label>Target Language</label>
  <input id="targetLang" type="text" placeholder="English" />

  <label>Extra Params <small>(optional JSON, e.g. {"temperature":0.3})</small></label>
  <textarea id="extraParams" placeholder='{"temperature": 0.3}'></textarea>

  <script src="popup.js"></script>
</body>
</html>
